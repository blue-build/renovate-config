---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Renovate

on:
    pull_request:
        branches:
            - main
        paths:
            - .github/workflows/renovate.yml
            - renovate-config.json
            - org-inherited-config.json
            - renovate.json
    schedule:
        # every hour
        - cron: 0 * * * *
    workflow_dispatch:
        inputs:
            logLevel:
                description: Log Level
                type: choice
                default: debug
                options:
                    - debug
                    - info
                required: true
            version:
                description: Renovate Version
                default: latest
                required: true

concurrency:
    group: ${{ github.workflow }}-${{ github.event.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    main:
        name: Renovate
        runs-on: ubuntu-latest
        permissions:
            packages: read
        steps:
            - name: Generate Token
              uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
              id: app-token
              with:
                  client-id: ${{ secrets.RENOVATE_APP_CLIENT_ID }}
                  private-key: ${{ secrets.RENOVATE_APP_PRIVATE_KEY }}
                  owner: ${{ github.repository_owner }}
                  # permission-administration: read
                  # permission-checks: write
                  # permission-contents: write
                  # permission-issues: write
                  # permission-members: read
                  # permission-metadata: read
                  # permission-pull-requests: write
                  # permission-statuses: write
                  # permission-vulnerability-alerts: read
                  # permission-workflows: write

            - name: Checkout
              uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  token: ${{ steps.app-token.outputs.token }}

            - name: Run Renovate
              uses: renovatebot/github-action@5402b206248e5a8c8427a15102702eb9c1793efc # v46.2.4
              env:
                  LOG_LEVEL: ${{ inputs.logLevel || 'debug' }}
                  RENOVATE_DRY_RUN: ${{ github.event_name == 'pull_request' && 'full' }}
              with:
                  token: ${{ steps.app-token.outputs.token }}
                  renovate-version: ${{ inputs.version || 'latest' }}
                  configurationFile: ./renovate-config.json
